<!DOCTYPE html>
<html>
    <head>
        <title>Kian Klicker</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <div class="panel left">
                <img id="sunburst" src="../assets/images/sunburst.jpg" draggable="false">
                <div class="content">
                    <h1>KIAN KLICKER</h1>
                    <p id="counter" class="counter">Kians: 0</p>
                    <button id="kianBtn">
                        <img id="kianImg" src="../assets/images/kians/BASE.png" draggable="false">
                    </button>
                </div>
            </div>

            <div class="divider"></div>

            <div class="panel right">
                <h1>SHOP</h1>
                <button id="upg.clickMulti" class="upgBtn">
                    CLICK MULTIPLIER: [COST]
                </button>
                <button id="upg.kianLevel" class="upgBtn">
                    Kian Level: [COST]
                </button>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
